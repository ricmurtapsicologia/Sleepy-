name: Generate natural audio

on:
  push:
    branches: [main]
    paths:
      - 'js/content.js'
      - 'scripts/export-audio.js'
      - 'scripts/generate-audio.py'
      - '.github/workflows/generate-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sono-audio-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install N2 audio renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts==7.2.8 pydub

      - name: Export scripts
        run: node scripts/export-audio.js /tmp/sono-audios.json

      - name: Generate Ampulheta N2 pt-BR male tracks
        env:
          SONO_VOICE: pt-BR-AntonioNeural
        run: python scripts/generate-audio.py /tmp/sono-audios.json audio

      - name: Verify generated tracks
        run: |
          test "$(find audio -maxdepth 1 -type f -name '*.mp3' | wc -l)" -ge 15
          test -f audio/welcome.mp3
          test -f audio/module1.mp3
          test -f audio/slow.mp3
          ffprobe -v error -show_entries stream=codec_name,channels,sample_rate -of default=nw=1 audio/welcome.mp3

      - name: Commit generated tracks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/*.mp3 audio/audio-spec.json
          if git diff --cached --quiet; then
            echo "No audio changes"
            exit 0
          fi
          git commit -m "build: gerar audios no perfil N2 Ampulheta"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
