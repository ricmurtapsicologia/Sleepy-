name: Finalize static experience

on:
  push:
    branches: [main]
    paths:
      - 'assets/social-preview.svg'
      - 'css/product-completion.css'
      - 'css/refinements.css'
      - 'js/product-completion.js'
      - 'js/audio-premium.js'
      - 'js/nav-fix.js'
      - '.github/workflows/finalize-static.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sono-static-finalization
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SVG renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
      - name: Generate social preview PNG
        run: rsvg-convert -w 1200 -h 630 assets/social-preview.svg -o assets/social-preview.png
      - name: Patch public HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='https://ricmurtapsicologia.github.io/Sleepy-/'
          new='https://ricmurtapsicologia.github.io/sono-em-dia-/'
          s=s.replace(old, new)
          if 'css/refinements.css' not in s:
              s=s.replace('<link rel="stylesheet" href="css/styles.css">','<link rel="stylesheet" href="css/styles.css">\n  <link rel="stylesheet" href="css/refinements.css">')
          if 'css/product-completion.css' not in s:
              s=s.replace('</head>','  <link rel="stylesheet" href="css/product-completion.css">\n</head>')
          if 'assets/social-preview.svg' in s:
              s=s.replace('<meta property="og:image" content="assets/social-preview.svg">','<meta property="og:image" content="https://ricmurtapsicologia.github.io/sono-em-dia-/assets/social-preview.png?v=20260825">')
          image='https://ricmurtapsicologia.github.io/sono-em-dia-/assets/social-preview.png?v=20260825'
          s=re.sub(r'https://ricmurtapsicologia\.github\.io/sono-em-dia-/assets/social-preview\.png(?:\?v=[^"]*)?', image, s)
          if 'property="og:image:width"' not in s:
              s=s.replace(f'<meta property="og:image" content="{image}">',f'<meta property="og:image" content="{image}">\n  <meta property="og:image:width" content="1200">\n  <meta property="og:image:height" content="630">\n  <meta property="og:image:type" content="image/png">')
          if 'property="og:url"' not in s:
              s=s.replace('<meta property="og:type" content="website">','<meta property="og:type" content="website">\n  <meta property="og:url" content="https://ricmurtapsicologia.github.io/sono-em-dia-/">')
          if 'property="og:image:secure_url"' not in s:
              s=s.replace(f'<meta property="og:image" content="{image}">',f'<meta property="og:image" content="{image}">\n  <meta property="og:image:secure_url" content="{image}">\n  <meta property="og:image:alt" content="Sono em Dia — Entenda seu sono. Cuide melhor das suas noites.">')
          if 'name="twitter:image"' not in s:
              s=s.replace('<meta name="twitter:card" content="summary_large_image">',f'<meta name="twitter:card" content="summary_large_image">\n  <meta name="twitter:image" content="{image}">')
          if 'rel="canonical"' not in s:
              s=s.replace('<title>Sono em Dia | Qualidade do Sono</title>','<title>Sono em Dia | Qualidade do Sono</title>\n  <link rel="canonical" href="https://ricmurtapsicologia.github.io/sono-em-dia-/">')
          s=s.replace('<a class="brand" href="#inicio" aria-label="Sono em Dia — início">','<a class="brand" href="#inicio" data-nav="inicio" aria-label="Sono em Dia — início">')
          if 'js/product-completion.js' not in s:
              s=s.replace('<script src="js/app.js"></script>','<script src="js/app.js"></script>\n  <script src="js/product-completion.js"></script>')
          if 'js/audio-premium.js' not in s:
              s=s.replace('</body>','  <script src="js/audio-premium.js"></script>\n</body>')
          if 'js/nav-fix.js' not in s:
              s=s.replace('</body>','  <script src="js/nav-fix.js"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit finalized public assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/social-preview.png
          if git diff --cached --quiet; then
            echo "No static changes"
            exit 0
          fi
          git commit -m "build: finalizar experiência pública e preview social"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
